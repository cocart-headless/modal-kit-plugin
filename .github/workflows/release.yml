name: Release

# Push a tag such as v1.0.0 (v1.0.0-beta.1 for a pre-release). This is the only
# thing that runs the checks automatically, to save Actions minutes. Each stage
# waits for the one before it, and nothing is published if any of them fails:
#
#   version -> development.yml -> testing.yml -> publish
#
# publish signs the zip and makes the GitHub release (zip and .sig). Sites get
# their updates from the package server (packages.cocartheadless.com), which
# reads the releases and signatures from here. Modal Kit isn't on WordPress.org.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  version:
    name: Check the tag matches the plugin's version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          version="${GITHUB_REF_NAME#v}"
          grep -Eq "^ \* Version: +${version}\s*$" modal-kit.php

  development:
    needs: version
    uses: ./.github/workflows/development.yml

  testing:
    needs: development
    uses: ./.github/workflows/testing.yml

  publish:
    name: Build and publish Modal Kit
    needs: testing
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run plugin-zip
      # Sites refuse an update that isn't signed with the key in
      # Updater::PUBLIC_KEY, so nothing is published without a signature.
      # Repository secret MODAL_KIT_SIGNING_KEY: the hex private key from
      # `node bin/sign-package.mjs --keygen`, the same one Modal Kit Pro's
      # releases use. It never goes to the package server.
      # Variable MODAL_KIT_PREVIOUS_PUBLIC_KEY: set only for the release that
      # changes the key, signed with the previous key.
      - name: Sign the zip
        env:
          MODAL_KIT_SIGNING_KEY: ${{ secrets.MODAL_KIT_SIGNING_KEY }}
          MODAL_KIT_PREVIOUS_PUBLIC_KEY: ${{ vars.MODAL_KIT_PREVIOUS_PUBLIC_KEY }}
        run: node bin/sign-package.mjs "releases/modal-kit-${GITHUB_REF_NAME#v}.zip"
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$GITHUB_REF_NAME" in
            *-*) prerelease=--prerelease ;;
            *) prerelease= ;;
          esac
          gh release create "$GITHUB_REF_NAME" releases/modal-kit-*.zip releases/modal-kit-*.zip.sig \
            --title "Modal Kit ${GITHUB_REF_NAME#v}" --generate-notes $prerelease
